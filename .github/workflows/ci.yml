name: CI — DiagoLAB Raporty+

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Typecheck · Testy · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Keszowanie cache budowania Next.js
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Instalacja zależności (reprodukowalna)
        run: npm ci

      - name: Generowanie typów routingu Next.js
        run: npx next typegen

      - name: TypeScript — zero błędów
        run: npx tsc --noEmit --pretty false

      - name: Testy jednostkowe (Vitest)
        run: npx vitest run --reporter=dot

      - name: Build produkcyjny
        run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/build_placeholder

      - name: Upload skompilowanej aplikacji (Oszczędność czasu dla E2E)
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            package.json
            package-lock.json
          retention-days: 1

      - name: Weryfikacja sekretów (gitleaks-style quick scan)
        run: |
          if grep -rInE "(sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" \
            --include="*.ts" --include="*.tsx" --include="*.js" src/ ; then
            echo "::error::Wykryto potencjalny sekret w kodzie!"; exit 1;
          fi
          echo "Brak sekretów w kodzie — OK"

  e2e:
    name: Testy E2E (Playwright · PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gates

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/app_db
      CI: "true"

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm

      - name: Pobranie gotowego buildu Next.js
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Instalacja zależności produkcyjnych
        run: npm ci

      - name: Weryfikacja spójności schematu Drizzle
        run: npx drizzle-kit check

      - name: Aplikowanie schematu bazy danych
        run: npx drizzle-kit push

      - name: Pobranie wersji Playwright ze środowiska
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Keszowanie binarów Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Przeglądarki Playwright (Instalacja tylko przy braku keszu)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalacja systemowych zależności Playwright (Wymagane zawsze)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Testy E2E
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
